server:
  port: 8082
spring:
  application:
    name: vidasalud-ms-catalog
  datasource:
    # La contraseña nunca va en el repositorio: se entrega con la variable de entorno DB_PASSWORD.
    url: ${DB_URL:jdbc:postgresql://aws-0-sa-east-1.pooler.supabase.com:6543/postgres?sslmode=require&prepareThreshold=0}
    username: ${DB_USERNAME:postgres.zcmgjhgjvtlceacwjuvv}
    password: ${DB_PASSWORD:}
